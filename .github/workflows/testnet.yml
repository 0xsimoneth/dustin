# Testnet tier, run on demand only. It needs no repository secret: every run funds its own
# throwaway accounts from Friendbot (docs/adr/ADR-0005-testing-strategy.md).
name: Testnet tier

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testnet
  cancel-in-progress: false

jobs:
  testnet:
    name: Testnet tier (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:testnet
        env:
          DUSTIN_TESTNET: "1"
