# Offline tier on every push and pull request (docs/adr/ADR-0005-testing-strategy.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tier (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:package
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
