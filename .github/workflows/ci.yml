# Offline tier on every push and pull request (docs/adr/ADR-0005-testing-strategy.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tier (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked files for secret seeds
        # A Stellar secret seed is "S" followed by 55 base32 characters (review R17). CI logs are
        # public, so only the names of matching files are printed (git grep -l), never the text.
        # git grep exits 0 when something matches, 1 when nothing does, and above 1 on an error.
        shell: bash
        run: |
          status=0
          files="$(git grep -l -E 'S[A-Z2-7]{55}')" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "No secret-seed-shaped string in the tracked files."
          elif [ "$status" -eq 0 ]; then
            echo "::error::Secret-seed-shaped strings found; remove them from these files:"
            printf '%s\n' "$files"
            exit 1
          else
            echo "::error::git grep failed with exit code $status"
            exit "$status"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:package
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
