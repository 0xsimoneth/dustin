# Offline tier on every push and pull request (docs/adr/ADR-0005-testing-strategy.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tier (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the engines floor in package.json (Epic 4 review D-12); 22 and 24 are the
        # latest of each line.
        node: [22.12.0, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the job token is not kept on disk while npm ci runs install
          # scripts (Epic 4 review D-11).
          persist-credentials: false
      - name: Scan tracked files for secret seeds
        # A Stellar secret seed is "S" followed by 55 base32 characters (review R17), standing alone:
        # the lookarounds skip such a run inside a longer base32 string, which about a third of
        # muxed M... addresses contain (review CL-12 and BH-14; the standalone rule of
        # containsSecretSeed in src/errors/redact.ts, which can also check a StrKey checksum). CI
        # logs are public, so only the names of matching files are
        # printed (git grep -l), never the text. git grep exits 0 when something matches, 1 when
        # nothing does, and above 1 on an error.
        shell: bash
        run: |
          status=0
          files="$(git grep -l -P '(?<![A-Z2-7])S[A-Z2-7]{55}(?![A-Z2-7])')" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "No secret-seed-shaped string in the tracked files."
          elif [ "$status" -eq 0 ]; then
            echo "::error::Secret-seed-shaped strings found; remove them from these files:"
            printf '%s\n' "$files"
            exit 1
          else
            echo "::error::git grep failed with exit code $status"
            exit "$status"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Type-check the examples against the built package's types
        run: npm run typecheck:examples
      - run: npm test
      - run: npm run check:package
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # The plan-only web demo (web/, story E5-S1, docs/web-demo.md): a post-sprint addition outside
  # the SOW. It consumes the root build, so the SDK entry is checked for Node-only APIs here, then
  # the page is linted, type-checked, built, unit-tested, and driven by Playwright against the
  # recorded Horizon fixtures (no network). Nothing is deployed.
  web:
    name: Web demo (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The SDK entry reaches no Node-only API
        run: node scripts/check-browser-safe.mjs
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
